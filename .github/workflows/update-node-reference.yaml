name: Update BT Node Reference Docs

on:
  push:
    branches:
      - "release/*"

jobs:
  update_node_reference:
    name: Update BT Node Reference Docs
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    container:
      image: ubuntu:noble
      env:
        PIP_BREAK_SYSTEM_PACKAGES: 1
    steps:
      - name: Setup ROS environment
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build workspace
        id: ros-build
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          import-token: ${{ secrets.GITHUB_TOKEN }}
          target-ros2-distro: jazzy
          vcs-repo-file-url: ${GITHUB_WORKSPACE}/update_node_reference_deps.repos
          package-name: auto_apms_px4
          coverage-result: false
          colcon-defaults: |
            {
              "build": {
                "cmake-args": [
                  "-DCMAKE_BUILD_TYPE=Release",
                  "-DBUILD_TESTING=OFF"
                ]
              }
            }

      - name: Generate Behavior Tree Node Reference
        shell: bash
        run: |
          source ${{ steps.ros-build.outputs.ros-workspace-directory-name }}/install/setup.bash
          ros2 run auto_apms_behavior_tree_core create_node_reference_markdown create_node_reference_markdown_output_px4.md auto_apms_px4::behavior_tree_nodes

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.UPDATE_BT_NODE_REF_APP_ID }}
          private-key: ${{ secrets.UPDATE_BT_NODE_REF_APP_PRIVATE_KEY }}
          owner: AutoAPMS
          repositories: "auto-apms-guide"

      - name: Checkout Documentation Repo
        uses: actions/checkout@v4
        with:
          repository: AutoAPMS/auto-apms-guide
          token: ${{ steps.generate-token.outputs.token }}  # Use GitHub App token
          path: docs-repo
          ref: master

      - name: Copy Updated Docs
        run: |
          cp create_node_reference_markdown_output_px4.md docs-repo/src/reference/create_node_reference_markdown_output_px4.md

      - name: Commit and Push Documentation
        run: |
          cd docs-repo
          git config user.name "update-bt-node-reference[bot]"
          git config user.email "update-bt-node-reference[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update px4 behavior tree node reference"
            git push
          fi