auto_apms_px4::behavior_mode_executor_params:
  activation:
    type: string
    default_value: armed
    read_only: true
    description: "When the FMU may activate the executor (armed | always | immediately)."
    validation:
      one_of<>: [["armed", "always", "immediately"]]

  mode_name:
    type: string
    default_value: "AutoAPMS Behavior"
    read_only: true
    description: "Registered name of the owned PX4 mode (the selectable mode that puts the executor in charge)."

  # Dynamic parameter: changes take effect on the next activation (when the executor is next put in charge).
  on_completion:
    type: string
    default_value: hold
    description: "In-charge reaction after the behavior succeeds (hold | rtl | land | disarm | complete | none). Applied on the next activation."
    validation:
      one_of<>: [["hold", "rtl", "land", "disarm", "complete", "none"]]

  # Dynamic parameter: changes take effect on the next activation (when the executor is next put in charge).
  on_failure:
    type: string
    default_value: hold
    description: "In-charge reaction after the behavior fails (hold | rtl | land | disarm | complete | none). Applied on the next activation."
    validation:
      one_of<>: [["hold", "rtl", "land", "disarm", "complete", "none"]]

  # Dynamic parameter: changes take effect on the next activation (when the executor is next put in charge).
  defer_failsafes:
    type: bool
    default_value: false
    description: "Defer FMU failsafes while a behavior is running (in-charge privilege). Applied on the next activation."

  # Read-only parameters: they seed the INITIAL behavior only. After startup the behavior is changed exclusively through
  # the 'set_behavior' service or the StartTreeExecutor action, both of which verify the new behavior by building its
  # tree before latching it (an invalid behavior is rejected and the previous one is kept).
  behavior:
    build_request:
      type: string
      default_value: ""
      read_only: true
      description: "Initial behavior build request. Changed at runtime via the 'set_behavior' service or the StartTreeExecutor action, not this parameter."
    entry_point:
      type: string
      default_value: ""
      read_only: true
      description: "Initial single point of entry for behavior execution. Changed at runtime via the 'set_behavior' service or the StartTreeExecutor action, not this parameter."
    node_manifest:
      type: string
      default_value: ""
      read_only: true
      description: "Initial encoded node manifest specifying additional behavior tree nodes to load. Changed at runtime via the 'set_behavior' service or the StartTreeExecutor action, not this parameter."
